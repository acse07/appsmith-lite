name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: appsmith
          POSTGRES_PASSWORD: appsmith_local
          POSTGRES_DB: appsmith
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U appsmith" --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://appsmith:appsmith_local@127.0.0.1:54329/appsmith?schema=public
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report/ }
